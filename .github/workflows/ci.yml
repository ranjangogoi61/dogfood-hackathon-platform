name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for app
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health && exit 0
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Ready (DB up)
        run: curl -sf http://localhost:3000/api/ready

      - name: Auth smoke test
        run: |
          curl -sf -c /tmp/cj -X POST http://localhost:3000/api/auth/register \
            -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"a-very-strong-password","displayName":"CI"}'
          curl -sf -b /tmp/cj http://localhost:3000/api/auth/me

      - name: Ready returns 503 when DB is down
        run: |
          docker compose stop db
          sleep 3
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/ready)
          docker compose start db
          [ "$status" = "503" ] || { echo "expected 503, got $status"; exit 1; }

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Teardown
        if: always()
        run: docker compose down -v
