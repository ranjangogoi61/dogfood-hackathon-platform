services:
  db:
    image: postgres:16-alpine
    container_name: dogfood-db
    environment:
      POSTGRES_DB: dogfood
      POSTGRES_USER: dogfood
      POSTGRES_PASSWORD: dogfood_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dogfood -d dogfood"]
      interval: 5s
      timeout: 3s
      retries: 20

  db-init:
    build:
      context: .
      target: db-init
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dogfood:dogfood_dev_password@db:5432/dogfood
    restart: "no"

  app:
    build:
      context: .
      target: runner
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://dogfood:dogfood_dev_password@db:5432/dogfood
      APP_URL: http://localhost:3000
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  pgdata:
